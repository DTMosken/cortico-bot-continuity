name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Prepare a version PR, publish, or finish an npm release
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - publish
          - finish

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  CORTICO_REF: 514ae61364bb534816e2d3e2eeb3ab7197c1fb34

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: extension

    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
        working-directory: .

      - name: Check out extension
        uses: actions/checkout@v7
        with:
          path: extension
          fetch-depth: 0

      - name: Check out Cortico
        uses: actions/checkout@v7
        with:
          repository: Pal-AI-Lab/Cortico
          ref: ${{ env.CORTICO_REF }}
          path: Cortico
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: extension/package.json

      - name: Update npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install Cortico dependencies
        working-directory: Cortico
        run: pnpm install --frozen-lockfile

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare version
        if: inputs.release_type != 'publish' && inputs.release_type != 'finish'
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version
          npm pkg set repository.type=git "repository.url=git+https://github.com/$GITHUB_REPOSITORY.git"

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck WebUI
        run: pnpm run --if-present typecheck:web

      - name: Build WebUI
        run: pnpm run build:webui

      - name: Check extension
        working-directory: Cortico
        run: pnpm check:extension ../extension

      - name: Audit release files
        run: node ../Cortico/node_modules/tsx/dist/cli.mjs ../Cortico/scripts/release-audit.ts

      - name: Pack release
        id: package
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [pack] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'npm-pack.json'), 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          for (const file of [pkg.main, pkg.cortico.webUiClient, pkg.cortico.webUiStyle, pkg.cortico.describe, 'CHANGELOG.md', 'AGENTS.md', 'CLAUDE.md'].filter(Boolean)) {
            if (!pack.files.some((entry) => entry.path === file.replace(/^\.\//, ''))) {
              throw new Error('Release is missing ' + file);
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, [
            'tarball=' + join(process.env.RUNNER_TEMP, pack.filename),
            'name=' + pkg.name,
            'version=' + pkg.version,
            'integrity=' + pack.integrity,
            '',
          ].join('\n'));
          console.log(pkg.name + '@' + pkg.version + ': ' + pack.files.length + ' files');
          NODE

      - name: Open version PR
        if: inputs.release_type != 'publish' && inputs.release_type != 'finish'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          branch="release/v$PACKAGE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json
          git commit -m "build(package.json): release $PACKAGE_VERSION"
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          更新 npm 包版本为 $PACKAGE_VERSION，并记录源码仓库地址。

          通过 CI 与审批后合并，再在 main 运行 Release 并选择 publish。
          EOF
          pr_url=$(gh pr create --base main --head "$branch" --title "build(package.json): release $PACKAGE_VERSION" --body-file "$RUNNER_TEMP/release-pr.md")
          gh workflow run ci.yml --ref "$branch"
          printf 'Version PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Push version tag
        if: inputs.release_type == 'publish'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v$PACKAGE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish to npm
        if: inputs.release_type == 'publish'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --registry=https://registry.npmjs.org

      - name: Verify npm version
        if: inputs.release_type == 'publish' || inputs.release_type == 'finish'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const name = process.env.PACKAGE_NAME;
          const version = process.env.PACKAGE_VERSION;
          let verified = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const read = async path => {
              const url = 'https://registry.npmjs.org/' + encodeURIComponent(name) + '/' + path + '?verify=' + Date.now() + '-' + attempt;
              try {
                const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(10000) });
                return response.ok ? await response.json() : null;
              } catch { return null; }
            };
            const [exact, latest] = await Promise.all([read(version), read('latest')]);
            if (exact?.version === version && latest?.version === version) {
              if (exact.dist?.integrity !== process.env.PACKAGE_INTEGRITY) throw new Error('Published tarball does not match workflow pack');
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Verified [' + name + '@' + version + '](https://www.npmjs.com/package/' + name + '/v/' + version + ')\n');
              verified = true;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!verified) throw new Error('Registry did not confirm ' + name + '@' + version);
          NODE

      - name: Create GitHub release
        if: inputs.release_type == 'publish' || inputs.release_type == 'finish'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const version = process.env.PACKAGE_VERSION;
          const start = lines.findIndex(line => line.startsWith('## ' + version + ' '));
          if (start < 0) throw new Error('Missing changelog for ' + version);
          let end = start + 1;
          while (end < lines.length && !lines[end].startsWith('## ')) end++;
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), lines.slice(start + 1, end).join('\n').trim() + '\n');
          NODE
          gh release create "v$PACKAGE_VERSION" "$TARBALL" --verify-tag --title "$PACKAGE_NAME $PACKAGE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
